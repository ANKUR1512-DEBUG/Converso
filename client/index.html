<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Converso</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🌍 Converso</h1>

    <p class="subtitle">
        Real-Time Language Conversion
    </p>


    <!-- ROOM -->

    <div class="card">

        <h3>🏠 Join Room</h3>

        <input
            id="roomInput"
            type="text"
            placeholder="Enter room code"
        >

        <button
            class="join-btn"
            onclick="joinRoom()"
        >
            Join
        </button>

        <p id="roomStatus" class="status">
            Not connected
        </p>

    </div>


    <!-- LANGUAGE -->

    <div class="card">

        <h3>🌐 Your Language</h3>

        <select id="languageSelect">

            <option value="en-IN">
                English
            </option>

            <option value="hi-IN">
                हिन्दी
            </option>

        </select>

        <p class="language-info">
            Select the language you will speak.
        </p>

    </div>


    <!-- AUDIO -->

    <div class="card">

        <h3>🎧 Audio</h3>

        <audio
            id="localAudio"
            autoplay
            muted>
        </audio>

        <audio
            id="remoteAudio"
            autoplay>
        </audio>

        <div class="audio-controls">

            <button
                id="muteBtn"
                class="mute-btn"
                onclick="toggleMute()"
            >
                🎤 Mute
            </button>

        </div>

    </div>


    <!-- TRANSLATION -->

    <div class="card">

        <h3>💬 Live Translation</h3>

        <div class="controls">

            <button
                class="talk-btn"
                onclick="startListening()"
            >
                🎤 Start
            </button>

            <button
                class="stop-btn"
                onclick="stopListening()"
            >
                ⛔ Stop
            </button>

        </div>

        <div
            id="chatBox"
            class="chat-box">
        </div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>

</html>
